  # 发起 EAD 前写入的应用索引、RPA 详情和附件资料表。
  process-instance:
    app-token: WlrRbzs3ia2EUBsI2qscO7Ajn1g
    application-index-table-id: tbl1Tvwl7t5RxcMs
    rpa-detail-table-id: tbl5Ks8cFcZeaWNN
    attachment-table-id: tbl4ImRqwcoGGpIX
  # 审批回传配置：上架申请/使用申请等表位于审批专用 Base。
  # 当前上架申请表链接对应的 table_id 为 tbl3z0pkeEWqlJRZ。
  approval-polling:
    enabled: true
    # 上架 / 使用飞书轮询可独立开关；总开关 enabled=false 时两者都不跑。
    onboarding-enabled: true
    use-enabled: true
    interval-ms: 300000
    initial-delay-ms: 10000
    # 使用申请未单独配置间隔时，复用上面的 interval-ms / initial-delay-ms。
    # use-interval-ms: 300000
    # use-initial-delay-ms: 15000
    app-token: WlrRbzs3ia2EUBsI2qscO7Ajn1g
    table-id: tbl3z0pkeEWqlJRZ
    use-table-id: tbl2x8E8crDcE4hH
