server:
  port: 28080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: exhibition-api
  servlet:
    multipart:
      enabled: true
      # 飞书多维表单个附件上限约 2GB
      max-file-size: 2048MB
      max-request-size: 2100MB
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  redis:
    # Redis 7.2
    host: 127.0.0.1
    port: 6379
#    password: 123456
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: 3000ms

